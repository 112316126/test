<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FHIR Patient 建立</title>
  <style>
    body { font-family: Arial, "Microsoft JhengHei", sans-serif; background:#f5f7fb; margin:0; color:#1f2937; }
    .wrap { max-width: 900px; margin: 40px auto; padding: 0 20px 50px; }
    .card { background:white; border-radius:14px; padding:24px; box-shadow:0 8px 24px rgba(0,0,0,.08); margin-bottom:20px; }
    h1 { margin-top:0; }
    label { display:block; font-weight:bold; margin:14px 0 6px; }
    input, select, textarea { width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:16px; }
    textarea { min-height:220px; font-family:Consolas, monospace; }
    button { margin:14px 8px 0 0; padding:10px 18px; border:0; border-radius:8px; cursor:pointer; font-size:16px; }
    .primary { background:#2563eb; color:white; }
    .success { background:#059669; color:white; }
    .note { background:#eff6ff; padding:12px 14px; border-left:4px solid #2563eb; border-radius:6px; }
    .status { white-space:pre-wrap; font-family:Consolas, monospace; background:#111827; color:#e5e7eb; padding:14px; border-radius:8px; min-height:80px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>建立 FHIR Patient</h1>
    <p>輸入暱稱與性別，先產生 FHIR R4 Patient JSON，再將 JSON POST 到 FHIR Server。</p>
    <div class="note">教學用公開測試伺服器：<b>https://hapi.fhir.org/baseR4</b>。請勿輸入真實敏感個資。</div>

    <label for="server">FHIR Server URL</label>
    <input id="server" value="https://hapi.fhir.org/baseR4">

    <label for="nickname">暱稱</label>
    <input id="nickname" placeholder="例如：FHIRStudent01">

    <label for="gender">性別</label>
    <select id="gender">
      <option value="unknown">unknown</option>
      <option value="male">male</option>
      <option value="female">female</option>
      <option value="other">other</option>
    </select>

    <button class="primary" onclick="generatePatient()">Button 1：產生 Patient JSON</button>
  </div>

  <div class="card">
    <h2>FHIR Patient JSON</h2>
    <textarea id="jsonArea" placeholder="按下 Button 1 後會在這裡產生 JSON"></textarea>
    <br>
    <button class="success" onclick="uploadPatient()">Button 2：POST 到 FHIR Server</button>
  </div>

  <div class="card">
    <h2>FHIR Server 回應</h2>
    <div id="result" class="status">尚未上傳。</div>
  </div>
</div>

<script>
function normalizeServer(url) {
  return url.trim().replace(/\/+$/, "");
}

function generatePatient() {
  const nickname = document.getElementById("nickname").value.trim();
  const gender = document.getElementById("gender").value;

  if (!nickname) {
    alert("請先輸入暱稱。");
    return;
  }

  const patient = {
    resourceType: "Patient",
    active: true,
    name: [
      {
        use: "usual",
        text: nickname
      }
    ],
    gender: gender
  };

  document.getElementById("jsonArea").value = JSON.stringify(patient, null, 2);
  document.getElementById("result").textContent = "Patient JSON 已產生，下一步可按 Button 2 上傳。";
}

async function uploadPatient() {
  const result = document.getElementById("result");
  const server = normalizeServer(document.getElementById("server").value);
  const text = document.getElementById("jsonArea").value.trim();

  if (!server) {
    alert("請輸入 FHIR Server URL。");
    return;
  }
  if (!text) {
    alert("請先按 Button 1 產生 Patient JSON。");
    return;
  }

  let patient;
  try {
    patient = JSON.parse(text);
  } catch (e) {
    alert("JSON 格式錯誤，請先修正。");
    return;
  }

  result.textContent = "上傳中...";

  try {
    const response = await fetch(server + "/Patient", {
      method: "POST",
      headers: {
        "Content-Type": "application/fhir+json",
        "Accept": "application/fhir+json"
      },
      body: JSON.stringify(patient)
    });

    const bodyText = await response.text();
    let body;
    try {
      body = JSON.parse(bodyText);
    } catch {
      body = bodyText;
    }

    const location = response.headers.get("Location") || response.headers.get("Content-Location") || "(無)";
    const patientId = body && typeof body === "object" ? (body.id || "(回應中沒有 id)") : "(無法解析)";

    result.textContent =
      "HTTP Status: " + response.status + " " + response.statusText + "\n" +
      "Patient ID: " + patientId + "\n" +
      "Location: " + location + "\n\n" +
      "Response Body:\n" +
      (typeof body === "string" ? body : JSON.stringify(body, null, 2));
  } catch (error) {
    result.textContent =
      "連線失敗：\n" + error.message +
      "\n\n請確認：\n1. 使用 Live Server 或 GitHub Pages 開啟網頁\n2. FHIR Server URL 正確\n3. 網路可連線到公開測試 Server";
  }
}
</script>
</body>
</html>
